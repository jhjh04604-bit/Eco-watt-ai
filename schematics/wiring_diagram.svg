<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mainsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pzemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="oledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">ECO WATT - IOT HARDWARE WIRING SCHEMATIC</text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">ESP32 + PZEM-004T v3.0 + SCT-013 Split Core CT + SSD1306 OLED + 4-Ch Relay</text>

  <!-- 230V AC MAINS BLOCK (TOP LEFT) -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="250" height="150" rx="10" fill="url(#mainsGrad)" stroke="#f87171" stroke-width="2"/>
    <text x="125" y="30" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">⚡ 230V AC MAINS / MCB</text>
    <rect x="20" y="45" width="210" height="25" rx="5" fill="#450a0a"/>
    <text x="125" y="62" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">LIVE / PHASE (RED WIRE)</text>
    <rect x="20" y="78" width="210" height="25" rx="5" fill="#1e3a8a"/>
    <text x="125" y="95" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">NEUTRAL (BLACK / BLUE)</text>
    <rect x="20" y="110" width="210" height="25" rx="5" fill="#14532d"/>
    <text x="125" y="127" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">EARTH GROUND (GREEN)</text>
  </g>

  <!-- PZEM-004T v3.0 (MIDDLE LEFT) -->
  <g transform="translate(40, 280)" filter="url(#shadow)">
    <rect width="250" height="210" rx="10" fill="url(#pzemGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="125" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">PZEM-004T v3.0 AC METER</text>
    <text x="125" y="46" text-anchor="middle" fill="#7dd3fc" font-size="11">Optocoupled Modbus TTL</text>
    
    <!-- AC Terminals -->
    <rect x="15" y="60" width="105" height="40" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
    <text x="67" y="78" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">AC L &amp; N</text>
    <text x="67" y="92" text-anchor="middle" fill="#94a3b8" font-size="9">Voltage Sense</text>

    <!-- CT Terminals -->
    <rect x="130" y="60" width="105" height="40" rx="6" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
    <text x="182" y="78" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">CT COIL</text>
    <text x="182" y="92" text-anchor="middle" fill="#94a3b8" font-size="9">100A Shunt Coil</text>

    <!-- TTL Terminals -->
    <rect x="15" y="115" width="220" height="80" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <circle cx="45" cy="140" r="7" fill="#ef4444"/>
    <text x="45" y="165" text-anchor="middle" fill="#fca5a5" font-size="10">5V</text>

    <circle cx="95" cy="140" r="7" fill="#64748b"/>
    <text x="95" y="165" text-anchor="middle" fill="#cbd5e1" font-size="10">GND</text>

    <circle cx="145" cy="140" r="7" fill="#eab308"/>
    <text x="145" y="165" text-anchor="middle" fill="#fef08a" font-size="10">TX</text>

    <circle cx="195" cy="140" r="7" fill="#22c55e"/>
    <text x="195" y="165" text-anchor="middle" fill="#bbf7d0" font-size="10">RX</text>
  </g>

  <!-- SCT-013 CT SENSOR (BOTTOM LEFT) -->
  <g transform="translate(40, 515)" filter="url(#shadow)">
    <rect width="250" height="105" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="125" y="25" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">SCT-013-000 BRANCH CT</text>
    <text x="125" y="43" text-anchor="middle" fill="#94a3b8" font-size="11">Non-Invasive Clamp (Appliance)</text>
    
    <rect x="15" y="52" width="220" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="125" y="70" text-anchor="middle" fill="#6ee7b7" font-size="11">Burden (22Ω) + 1.65V DC Bias</text>
    <text x="125" y="85" text-anchor="middle" fill="#cbd5e1" font-size="10">Output ──► ESP32 GPIO 34 (ADC1)</text>
  </g>

  <!-- ESP32 CONTROLLER (CENTER) -->
  <g transform="translate(370, 110)" filter="url(#shadow)">
    <rect width="280" height="460" rx="12" fill="url(#espGrad)" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Chip Header -->
    <rect x="20" y="15" width="240" height="50" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="140" y="38" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">ESP32-WROOM-32</text>
    <text x="140" y="55" text-anchor="middle" fill="#a5b4fc" font-size="11">WiFi + BLE + Indian Tariff Engine</text>

    <!-- Pin Headers Left -->
    <g transform="translate(20, 80)">
      <!-- 5V / VIN -->
      <rect x="0" y="0" width="105" height="26" rx="4" fill="#334155"/>
      <text x="10" y="18" fill="#ef4444" font-size="11" font-weight="bold">VIN (5V)</text>
      
      <!-- GND -->
      <rect x="0" y="34" width="105" height="26" rx="4" fill="#334155"/>
      <text x="10" y="52" fill="#94a3b8" font-size="11" font-weight="bold">GND</text>
      
      <!-- GPIO 16 (RX2) -->
      <rect x="0" y="68" width="105" height="26" rx="4" fill="#334155"/>
      <text x="10" y="86" fill="#eab308" font-size="11" font-weight="bold">GPIO 16 (RX2)</text>
      
      <!-- GPIO 17 (TX2) -->
      <rect x="0" y="102" width="105" height="26" rx="4" fill="#334155"/>
      <text x="10" y="120" fill="#22c55e" font-size="11" font-weight="bold">GPIO 17 (TX2)</text>

      <!-- GPIO 34 (ADC) -->
      <rect x="0" y="136" width="105" height="26" rx="4" fill="#334155"/>
      <text x="10" y="154" fill="#10b981" font-size="11" font-weight="bold">GPIO 34 (ADC)</text>

      <!-- 3V3 Rail -->
      <rect x="0" y="170" width="105" height="26" rx="4" fill="#334155"/>
      <text x="10" y="188" fill="#38bdf8" font-size="11" font-weight="bold">3V3</text>
    </g>

    <!-- Pin Headers Right -->
    <g transform="translate(155, 80)">
      <!-- GPIO 21 (SDA) -->
      <rect x="0" y="0" width="105" height="26" rx="4" fill="#334155"/>
      <text x="15" y="18" fill="#c084fc" font-size="11" font-weight="bold">GPIO 21 (SDA)</text>

      <!-- GPIO 22 (SCL) -->
      <rect x="0" y="34" width="105" height="26" rx="4" fill="#334155"/>
      <text x="15" y="52" fill="#c084fc" font-size="11" font-weight="bold">GPIO 22 (SCL)</text>

      <!-- GPIO 25 (RELAY 1) -->
      <rect x="0" y="68" width="105" height="26" rx="4" fill="#334155"/>
      <text x="15" y="86" fill="#f43f5e" font-size="11" font-weight="bold">GPIO 25 (RY1)</text>

      <!-- GPIO 26 (RELAY 2) -->
      <rect x="0" y="102" width="105" height="26" rx="4" fill="#334155"/>
      <text x="15" y="120" fill="#f43f5e" font-size="11" font-weight="bold">GPIO 26 (RY2)</text>

      <!-- GPIO 27 (RELAY 3) -->
      <rect x="0" y="136" width="105" height="26" rx="4" fill="#334155"/>
      <text x="15" y="154" fill="#f43f5e" font-size="11" font-weight="bold">GPIO 27 (RY3)</text>

      <!-- GPIO 14 (RELAY 4) -->
      <rect x="0" y="170" width="105" height="26" rx="4" fill="#334155"/>
      <text x="15" y="188" fill="#f43f5e" font-size="11" font-weight="bold">GPIO 14 (RY4)</text>
    </g>

    <!-- Internal Features Card -->
    <rect x="20" y="295" width="240" height="145" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="140" y="318" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">⚡ FIRMWARE ENGINE</text>
    <text x="35" y="342" fill="#cbd5e1" font-size="11">• Indian Slab Tariff Math (₹/kWh)</text>
    <text x="35" y="362" fill="#cbd5e1" font-size="11">• Appliance NILM Signature AI</text>
    <text x="35" y="382" fill="#cbd5e1" font-size="11">• WebSocket Telemetry Stream</text>
    <text x="35" y="402" fill="#cbd5e1" font-size="11">• AsyncWebServer on :80</text>
    <text x="35" y="422" fill="#10b981" font-size="11">• Anomaly &amp; Vampire Load Alerts</text>
  </g>

  <!-- SSD1306 OLED DISPLAY (TOP RIGHT) -->
  <g transform="translate(710, 90)" filter="url(#shadow)">
    <rect width="250" height="190" rx="10" fill="url(#oledGrad)" stroke="#818cf8" stroke-width="2"/>
    <text x="125" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">0.96" OLED (SSD1306 I2C)</text>
    
    <!-- Screen Simulation -->
    <rect x="25" y="42" width="200" height="95" rx="6" fill="#000000" stroke="#06b6d4" stroke-width="1"/>
    <text x="35" y="65" fill="#38bdf8" font-size="12" font-family="Courier, monospace">ECO WATT: 232.4V</text>
    <text x="35" y="83" fill="#4ade80" font-size="13" font-weight="bold" font-family="Courier, monospace">LOAD: 12.8A (2974W)</text>
    <text x="35" y="100" fill="#facc15" font-size="11" font-family="Courier, monospace">TODAY: 14.2 kWh (₹78)</text>
    <text x="35" y="118" fill="#f87171" font-size="10" font-family="Courier, monospace">SLAB 2 [101-200 kWh]</text>
    <text x="35" y="130" fill="#93c5fd" font-size="9" font-family="Courier, monospace">AI: AC is consuming 68%</text>

    <!-- Pins -->
    <text x="125" y="160" text-anchor="middle" fill="#cbd5e1" font-size="11">VCC(3V3) | GND | SCL(22) | SDA(21)</text>
  </g>

  <!-- 4-CHANNEL RELAY MODULE (BOTTOM RIGHT) -->
  <g transform="translate(710, 310)" filter="url(#shadow)">
    <rect width="250" height="260" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="125" y="28" text-anchor="middle" fill="#f43f5e" font-size="14" font-weight="bold">4-CH RELAY MODULE (5V)</text>
    <text x="125" y="48" text-anchor="middle" fill="#94a3b8" font-size="11">Optocoupled Load Shedding</text>
    
    <!-- Relays -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="210" height="38" rx="5" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="24" fill="#fda4af" font-size="11" font-weight="bold">RELAY 1 (GPIO 25):</text>
      <text x="130" y="24" fill="#fecdd3" font-size="11">Geyser Cutoff</text>
      
      <rect x="0" y="46" width="210" height="38" rx="5" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="70" fill="#fda4af" font-size="11" font-weight="bold">RELAY 2 (GPIO 26):</text>
      <text x="130" y="70" fill="#fecdd3" font-size="11">Inverter AC Eco</text>
      
      <rect x="0" y="92" width="210" height="38" rx="5" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="116" fill="#fda4af" font-size="11" font-weight="bold">RELAY 3 (GPIO 27):</text>
      <text x="130" y="116" fill="#fecdd3" font-size="11">EV / Heavy Load</text>

      <rect x="0" y="138" width="210" height="38" rx="5" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="162" fill="#fda4af" font-size="11" font-weight="bold">RELAY 4 (GPIO 14):</text>
      <text x="130" y="162" fill="#fecdd3" font-size="11">Vampire Strips</text>
    </g>
  </g>

  <!-- WIRING TRACES / BUS CONNECTIONS -->
  <!-- PZEM TX (145) to ESP32 RX2 (390, 248) -->
  <path d="M 235 420 L 320 420 L 320 248 L 370 248" fill="none" stroke="#eab308" stroke-width="2.5" stroke-dasharray="6,4"/>
  
  <!-- PZEM RX (195) to ESP32 TX2 (390, 282) -->
  <path d="M 235 450 L 335 450 L 335 282 L 370 282" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- SCT-013 to ESP32 ADC (390, 316) -->
  <path d="M 290 565 L 350 565 L 350 316 L 370 316" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- ESP32 I2C to OLED -->
  <path d="M 650 190 L 680 190 L 680 200 L 710 200" fill="none" stroke="#c084fc" stroke-width="2.5"/>

  <!-- ESP32 Relays to 4-Ch Relay -->
  <path d="M 650 258 L 685 258 L 685 390 L 710 390" fill="none" stroke="#f43f5e" stroke-width="2.5"/>

  <!-- Legend at Bottom -->
  <g transform="translate(150, 630)">
    <circle cx="0" cy="0" r="5" fill="#eab308"/>
    <text x="12" y="4" fill="#94a3b8" font-size="11">Serial RX/TX (Modbus TTL)</text>
    
    <circle cx="210" cy="0" r="5" fill="#10b981"/>
    <text x="222" y="4" fill="#94a3b8" font-size="11">Analog Current Sensing (CT)</text>
    
    <circle cx="430" cy="0" r="5" fill="#c084fc"/>
    <text x="442" y="4" fill="#94a3b8" font-size="11">I2C Bus (SDA/SCL)</text>

    <circle cx="610" cy="0" r="5" fill="#f43f5e"/>
    <text x="622" y="4" fill="#94a3b8" font-size="11">GPIO Relay Trigger (Active LOW)</text>
  </g>
</svg>
