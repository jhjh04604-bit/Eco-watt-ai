<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoWatt — Smart IoT Energy Monitor &amp; AI Bill Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Smart Auth Router: If user is already authenticated, go to Dashboard; otherwise go to Login
    try {
      var auth = localStorage.getItem("ecowatt_auth_user");
      if (auth) {
        window.location.replace("web_dashboard/index.html");
      } else {
        window.location.replace("web_dashboard/login.html");
      }
    } catch (e) {
      window.location.replace("web_dashboard/login.html");
    }
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      --btn-sec-bg: #f1f5f9;
      --btn-sec-border: #cbd5e1;
      --btn-sec-text: #0284c7;
    }
    [data-theme="dark"] {
      --bg: #070c18;
      --card-bg: rgba(17, 26, 46, 0.85);
      --card-border: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      --btn-sec-bg: rgba(56, 189, 248, 0.12);
      --btn-sec-border: rgba(56, 189, 248, 0.3);
      --btn-sec-text: #38bdf8;
    }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      transition: background 0.25s, color 0.25s;
    }
    .splash-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 30px;
      max-width: 440px;
      box-shadow: var(--shadow);
    }
    .logo-badge {
      font-size: 2.2rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      font-weight: 800;
      color: var(--text-main);
    }
    p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .links-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #059669;
      color: #ffffff;
    }
    .btn-secondary {
      background: var(--btn-sec-bg);
      border: 1px solid var(--btn-sec-border);
      color: var(--btn-sec-text);
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-badge">⚡</div>
    <h1>EcoWatt Smart Energy</h1>
    <p>Loading IoT Telemetry &amp; AI Bill Optimizer...</p>
    <div class="links-row">
      <a href="web_dashboard/login.html" class="btn btn-primary">Sign In</a>
      <a href="web_dashboard/index.html" class="btn btn-secondary">Guest Dashboard</a>
    </div>
  </div>
</body>
</html>
